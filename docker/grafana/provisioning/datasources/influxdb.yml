apiVersion: 1

datasources:
  - name: InfluxDB
    uid: influxdb
    type: influxdb
    access: proxy
    url: $INFLUXDB_URL
    user: speedtest
    isDefault: true
    jsonData:
      dbName: speedtest
      httpMode: POST
      version: InfluxQL
    secureJsonData:
      password: $INFLUXDB_PASSWORD
